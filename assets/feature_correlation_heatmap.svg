<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="380">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #1e293b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
    .cell-txt { font-family: monospace; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .cell-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
  </style>
  <rect width="800" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="38" class="title">84-Feature Statistical Concordance Heatmap (Java vs Rust)</text>
  <text x="30" y="58" class="subtitle">Pearson Correlation (r) and Mean Absolute Error (MAE) across canonical feature groups.</text>

  <!-- Heatmap Grid -->
  <!-- Headers -->
  <text x="220" y="95" class="label" font-weight="bold">Feature Group</text>
  <text x="450" y="95" class="label" font-weight="bold">Pearson r</text>
  <text x="560" y="95" class="label" font-weight="bold">MAE</text>
  <text x="670" y="95" class="label" font-weight="bold">Concordance</text>
  <line x1="30" y1="105" x2="770" y2="105" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 1 -->
  <text x="30" y="132" class="cell-lbl">Flow Duration &amp; Packet Counts (1-10)</text>
  <rect x="420" y="115" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="131" class="cell-txt">1.0000</text>
  <rect x="540" y="115" width="60" height="24" rx="4" fill="#059669"/>
  <text x="570" y="131" class="cell-txt">0.0000</text>
  <text x="670" y="132" class="cell-lbl" font-weight="bold" fill="#059669">100.0% Exact</text>

  <!-- Row 2 -->
  <text x="30" y="167" class="cell-lbl">Payload Length Statistics (11-20, 45-49)</text>
  <rect x="420" y="150" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="166" class="cell-txt">1.0000</text>
  <rect x="540" y="150" width="60" height="24" rx="4" fill="#059669"/>
  <text x="570" y="166" class="cell-txt">0.0000</text>
  <text x="670" y="167" class="cell-lbl" font-weight="bold" fill="#059669">100.0% Exact</text>

  <!-- Row 3 -->
  <text x="30" y="202" class="cell-lbl">Throughput &amp; Packet Rates (21-22, 43-44)</text>
  <rect x="420" y="185" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="201" class="cell-txt">1.0000</text>
  <rect x="540" y="185" width="60" height="24" rx="4" fill="#059669"/>
  <text x="570" y="201" class="cell-txt">0.0000</text>
  <text x="670" y="202" class="cell-lbl" font-weight="bold" fill="#059669">100.0% Exact</text>

  <!-- Row 4 -->
  <text x="30" y="237" class="cell-lbl">Inter-Arrival Time (IAT) Metrics (23-36)</text>
  <rect x="420" y="220" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="236" class="cell-txt">1.0000</text>
  <rect x="540" y="220" width="60" height="24" rx="4" fill="#059669"/>
  <text x="570" y="236" class="cell-txt">0.0000</text>
  <text x="670" y="237" class="cell-lbl" font-weight="bold" fill="#059669">100.0% Exact</text>

  <!-- Row 5 -->
  <text x="30" y="272" class="cell-lbl">TCP Control Flags (37-40, 50-57)</text>
  <rect x="420" y="255" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="271" class="cell-txt">1.0000</text>
  <rect x="540" y="255" width="60" height="24" rx="4" fill="#059669"/>
  <text x="570" y="271" class="cell-txt">0.0000</text>
  <text x="670" y="272" class="cell-lbl" font-weight="bold" fill="#059669">100.0% Exact</text>

  <!-- Row 6 -->
  <text x="30" y="307" class="cell-lbl">Bulk Transfer Rates &amp; Counts (62-67)</text>
  <rect x="420" y="290" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="306" class="cell-txt">1.0000</text>
  <rect x="540" y="290" width="60" height="24" rx="4" fill="#059669"/>
  <text x="570" y="306" class="cell-txt">0.0000</text>
  <text x="670" y="307" class="cell-lbl" font-weight="bold" fill="#059669">100.0% Exact</text>

  <!-- Row 7 -->
  <text x="30" y="342" class="cell-lbl">Active &amp; Idle State Windows (76-83)</text>
  <rect x="420" y="325" width="80" height="24" rx="4" fill="#059669"/>
  <text x="460" y="341" class="cell-txt">1.0000</text>
  <rect x="540" y="325" width="60" height="24" rx="4" fill="#059669"/>
