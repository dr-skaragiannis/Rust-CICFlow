<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="360">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #1e293b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4; }
  </style>
  <rect width="800" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="38" class="title">Throughput Benchmark Comparison (Packets / Second)</text>
  <text x="30" y="58" class="subtitle">Higher is better. Stress test on 50,000 packets with 500 concurrent bidirectional flows.</text>
  
  <!-- Grid lines -->
  <line x1="180" y1="90" x2="740" y2="90" class="grid"/>
  <line x1="180" y1="160" x2="740" y2="160" class="grid"/>
  <line x1="180" y1="230" x2="740" y2="230" class="grid"/>
  <line x1="180" y1="300" x2="740" y2="300" class="grid"/>

  <!-- Rust -->
  <text x="30" y="125" class="label">Rust CICFlowMeter</text>
  <rect x="180" y="102" width="520" height="36" rx="6" fill="#10b981"/>
  <text x="708" y="125" class="val">686,116 pkts/s (14.5x - 60.9x faster)</text>

  <!-- Java -->
  <text x="30" y="195" class="label">Java CICFlowMeter</text>
  <rect x="180" y="172" width="36" height="36" rx="6" fill="#f59e0b"/>
  <text x="226" y="195" class="val">47,355 pkts/s</text>

  <!-- Python -->
  <text x="30" y="265" class="label">Python Scapy Meter</text>
  <rect x="180" y="242" width="8" height="36" rx="4" fill="#ef4444"/>
  <text x="198" y="265" class="val">~8,200 pkts/s</text>

  <!-- Scale -->
  <text x="180" y="325" class="subtitle">0</text>
  <text x="320" y="325" class="subtitle">150k</text>
  <text x="460" y="325" class="subtitle">300k</text>
  <text x="600" y="325" class="subtitle">450k</text>
  <text x="700" y="325" class="subtitle">700k pkts/s</text>
</svg>