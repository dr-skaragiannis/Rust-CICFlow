[package]
name = "cicflowmeter"
version = "0.1.0"
edition = "2021"
authors = ["CICFlowMeter Rust Contributors"]
description = "High-performance, memory-safe network traffic flow feature generator and PCAP analyzer in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["pcap", "flowmeter", "network", "ids", "cicids"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
byteorder = "1.5"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
rayon = "1.10"
ahash = "0.8"
hashbrown = { version = "0.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
log = "0.4"
env_logger = "0.11"
indicatif = { version = "0.17", features = ["rayon"] }
thiserror = "1.0"
anyhow = "1.0"
ctrlc = "3.4"
pcap = { version = "2.2", optional = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["live-capture"]
live-capture = ["dep:pcap"]

[[bin]]
name = "cicflowmeter"
path = "src/bin/main.rs"

[[bench]]
name = "flow_bench"
harness = false

[lib]
name = "cicflowmeter"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
